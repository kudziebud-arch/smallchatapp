<!DOCTYPE html>
<html>

<head>
    <title>Chat App using Socket.IO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <h1 class="font-bold text-green-500 text-3xl text-center mt-5">
        GeeksforGeeks
    </h1>

    <h2 class="font-semibold text-xl text-center mt-5">
        Chat App using Socket.IO
    </h2>

    <form id="form" class="flex flex-col items-center mt-5">

        <input
            id="myname"
            type="text"
            placeholder="Name"
            class="border border-gray-400 rounded-md p-2 mt-3">

        <input
            id="message"
            type="text"
            placeholder="Message"
            class="border border-gray-400 rounded-md p-2 mt-3">

        <button
            class="bg-blue-500 text-white rounded-md px-5 py-2 mt-5">
            Send
        </button>

    </form>

    <div
        id="messageArea"
        class="flex flex-col items-center mt-5">
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>

        const socket = io();

        const form = document.getElementById("form");
        const myname = document.getElementById("myname");
        const message = document.getElementById("message");
        const messageArea = document.getElementById("messageArea");

        form.addEventListener("submit", function (e) {

            e.preventDefault();

            if (
                myname.value.trim() !== "" &&
                message.value.trim() !== ""
            ) {

                socket.emit("send name", myname.value);

                socket.emit("send message", message.value);

                message.value = "";

            }

        });

        socket.on("send name", function (username) {

            const p = document.createElement("p");

            p.style.background = "gray";
            p.style.color = "white";
            p.style.width = "100%";
            p.style.textAlign = "center";

            p.innerHTML = "<b>" + username + "</b>";

            messageArea.appendChild(p);

        });

        socket.on("send message", function (chat) {

            const p = document.createElement("p");

            p.textContent = chat;

            messageArea.appendChild(p);

        });

    </script>

</body>

</html>
